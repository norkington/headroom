name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where this actually runs day to day, and it is where the
        # platform-specific code lives -- detached spawning, CREATE_BREAKAWAY_FROM_JOB,
        # the WMI fallback. Testing only on Linux would exercise none of it.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        # The parity suite needs a real llama.cpp install and shell launcher, so
        # it skips here. The unit suite is deliberately portable so this job
        # still proves something -- a pipeline whose only signal is "everything
        # skipped" is decoration.
        run: uv run pytest -v --strict-markers

      - name: Import the app without a GPU
        # NVML is absent on CI runners. The app must still start and report the
        # backend as unavailable rather than crashing -- that is the same path a
        # user on an unsupported GPU hits.
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from headroom.app import create_app, Settings
          with TestClient(create_app(Settings())) as c:
              h = c.get('/api/health').json()
              assert h['ok'] is True, h
              print('health ok, gpu backend available:', h['gpu_backend_available'])
              g = c.get('/api/gpus').json()
              assert g['gpus'] == [], 'expected no GPUs on a CI runner'
              print('gpus endpoint degrades cleanly with no NVML')
              s = c.get('/api/server').json()
              assert s['status'] == 'stopped', s
              print('server endpoint reports stopped with nothing running')
          "

  web:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Confirm the build lands inside the package
        # The backend serves the UI from src/headroom/static, and that path is
        # what makes it ship in the wheel. If the Vite outDir ever drifts, the
        # published package silently loses its interface.
        run: |
          test -f src/headroom/static/index.html \
            || { echo "frontend did not build into src/headroom/static"; exit 1; }
          echo "UI built into the package"
