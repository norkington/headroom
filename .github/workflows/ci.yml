name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push should cancel the first run rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where this actually runs day to day, and it is where the
        # platform-specific code lives -- detached spawning, CREATE_BREAKAWAY_FROM_JOB,
        # the WMI fallback. Testing only on Linux would exercise none of it.
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Test
        # The parity suite needs a real llama.cpp install and shell launcher, so
        # it skips here. The unit suite is deliberately portable so this job
        # still proves something -- a pipeline whose only signal is "everything
        # skipped" is decoration.
        run: uv run pytest -v --strict-markers

      # NOTE: there is deliberately no inline Python here any more. The
      # degraded-environment checks -- no GPU, no registry, no llama.cpp -- now
      # live in tests/test_units.py, where they are linted, formatted and run on
      # every developer machine. An earlier version embedded them in this file,
      # where nothing checked them, and they drifted against a changed
      # constructor signature until CI caught it.

  web:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Confirm the build lands inside the package
        # The backend serves the UI from src/headroom/static, and that path is
        # what makes it ship in the wheel. If the Vite outDir ever drifts, the
        # published package silently loses its interface.
        run: |
          test -f src/headroom/static/index.html \
            || { echo "frontend did not build into src/headroom/static"; exit 1; }
          echo "UI built into the package"
