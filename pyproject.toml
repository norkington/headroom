[project]
name = "headroom"
version = "0.1.0"
description = "A hardware-aware operations console for local LLM inference on constrained GPUs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "norkington" }]
keywords = ["llama.cpp", "gguf", "local-llm", "gpu", "vram", "inference"]
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "nvidia-ml-py>=12.560",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
headroom = "headroom.__main__:main"

[project.urls]
Homepage = "https://github.com/norkington/headroom"
Issues = "https://github.com/norkington/headroom/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/headroom"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
